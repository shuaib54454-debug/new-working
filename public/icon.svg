<svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#C59B27" />
    </linearGradient>

    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3A60" />
      <stop offset="50%" stop-color="#0E294B" />
      <stop offset="100%" stop-color="#081A32" />
    </linearGradient>

    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="waveNavyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#081A32" />
      <stop offset="50%" stop-color="#0E294B" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Clip Paths & Filters -->
    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#081A32" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Outer Architectural Medallion Frame -->
  <g filter="url(#subtleDrop)">
    <!-- Outer Ring Base -->
    <circle cx="250" cy="230" r="160" fill="#0E294B" stroke="url(#goldGrad)" stroke-width="4" />
    <circle cx="250" cy="230" r="148" fill="#FAF8F5" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="250" cy="230" r="142" fill="none" stroke="#0E294B" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

    <!-- Traditional Ethiopian / Islamic 8-Pointed Crest & Points -->
    <g transform="translate(250, 230)">
      <!-- Top Crest Crown -->
      <path d="M 0 -160 L 10 -178 L 0 -192 L -10 -178 Z" fill="url(#goldGrad)" stroke="#0E294B" stroke-width="1.5" />
      <circle cx="0" cy="-176" r="3" fill="#0E294B" />

      <!-- Perimeter Accent Diamond Points -->
      <path d="M 160 0 L 175 6 L 160 12 Z" fill="url(#goldGrad)" />
      <path d="M -160 0 L -175 6 L -160 12 Z" fill="url(#goldGrad)" />
      <path d="M 0 160 L 6 175 L -6 175 Z" fill="url(#goldGrad)" />
      <path d="M 113 -113 L 126 -122 L 120 -110 Z" fill="url(#goldGrad)" />
      <path d="M -113 -113 L -126 -122 L -120 -110 Z" fill="url(#goldGrad)" />
      <path d="M 113 113 L 124 122 L 112 124 Z" fill="url(#goldGrad)" />
      <path d="M -113 113 L -124 122 L -112 124 Z" fill="url(#goldGrad)" />

      <!-- Geometric Lattice Ring Filigree -->
      <circle cx="0" cy="0" r="128" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7" />
      <path d="M -90 -90 L -70 -105 L -50 -90 L -30 -105 L -10 -90 L 10 -105 L 30 -90 L 50 -105 L 70 -90 L 90 -105" 
            stroke="url(#goldGrad)" stroke-width="1.2" fill="none" opacity="0.45" />
    </g>

    <!-- Interior Sky/Atmosphere -->
    <circle cx="250" cy="230" r="124" fill="#FFFFFF" />

    <!-- Central Suspension Bridge Arch -->
    <!-- Outer Arch Backbone -->
    <path d="M 120 270 C 145 130, 355 130, 380 270 C 350 255, 335 160, 250 160 C 165 160, 150 255, 120 270 Z" 
          fill="url(#goldGrad)" stroke="#0E294B" stroke-width="2" />

    <!-- Bridge Arch Cable Stays (Radiating Suspension Lines) -->
    <!-- Left Stays -->
    <line x1="250" y1="160" x2="145" y2="265" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" />
    <line x1="250" y1="160" x2="170" y2="262" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" />
    <line x1="250" y1="160" x2="195" y2="260" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" />
    <line x1="250" y1="160" x2="220" y2="258" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" />

    <!-- Right Stays -->
    <line x1="250" y1="160" x2="355" y2="265" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" />
    <line x1="250" y1="160" x2="330" y2="262" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" />
    <line x1="250" y1="160" x2="305" y2="260" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" />
    <line x1="250" y1="160" x2="280" y2="258" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" />

    <!-- Crown Tower of Bridge Arch -->
    <polygon points="250,140 256,155 244,155" fill="url(#goldGrad)" stroke="#0E294B" stroke-width="1.5" />

    <!-- Silhouette Map of Ethiopia (Inside Arch Center) -->
    <g transform="translate(225, 185) scale(0.65)">
      <!-- Detailed Map Contour -->
      <path d="M 38 5 
               C 45 4, 52 10, 58 14 
               C 65 18, 74 15, 82 20 
               C 88 24, 94 30, 92 38 
               C 90 46, 82 52, 78 58 
               C 74 65, 76 72, 70 78 
               C 62 85, 52 90, 42 92 
               C 34 94, 25 88, 18 84 
               C 12 80, 8 72, 6 64 
               C 4 56, 8 48, 12 40 
               C 16 32, 22 24, 26 16 
               C 30 10, 34 6, 38 5 Z" 
            fill="url(#goldGrad)" 
            stroke="#0E294B" 
            stroke-width="2" />
      <!-- Traditional Ethiopian Crosshatch/Filigree Interior Details -->
      <path d="M 28 28 L 68 68 M 68 28 L 28 68" stroke="#0E294B" stroke-width="1" opacity="0.45" />
      <path d="M 48 18 L 48 78 M 18 48 L 78 48" stroke="#0E294B" stroke-width="1" opacity="0.45" />
      <circle cx="48" cy="48" r="8" fill="none" stroke="#0E294B" stroke-width="1.2" opacity="0.6" />
    </g>

    <!-- Dynamic Flowing Ocean Waves & Trade Navigation Arrows -->
    <!-- Primary Flow Deck Line -->
    <path d="M 110 270 Q 250 250 390 270 Q 250 262 110 270 Z" fill="url(#goldGrad)" />

    <!-- Upper Wave with Integrated Forward Arrow (Teal / Sky Blue) -->
    <path d="M 125 272 
             C 170 275, 220 285, 275 282 
             C 325 280, 360 270, 395 260 
             L 378 252 
             L 395 260 
             L 375 270 
             C 345 278, 310 292, 260 294 
             C 210 296, 160 284, 125 272 Z" 
          fill="url(#tealGrad)" />

    <!-- Main Navigation Forward Arrow (Flowing from Left to Right) -->
    <g transform="translate(0, 0)">
      <!-- Deep Navy Primary Trade Wave -->
      <path d="M 135 288 
               C 180 292, 225 310, 275 308 
               C 315 306, 345 292, 380 278 
               L 362 272 
               L 380 278 
               L 364 288 
               C 335 302, 300 320, 255 320 
               C 210 320, 170 304, 135 288 Z" 
            fill="url(#waveNavyGrad)" />

      <!-- Second Powerful Lower Wave Sweeping Forward -->
      <path d="M 160 306 
               C 200 312, 235 332, 280 330 
               C 320 328, 350 312, 375 296 
               C 345 318, 305 342, 260 342 
               C 220 342, 185 324, 160 306 Z" 
            fill="url(#tealGrad)" opacity="0.9" />

      <!-- Base Stabilizer Wave (Navy Foundation) -->
      <path d="M 190 328 
               C 225 334, 250 350, 285 348 
               C 310 346, 335 334, 355 320 
               C 330 338, 300 358, 265 358 
               C 235 358, 210 344, 190 328 Z" 
            fill="#0E294B" />
    </g>

    <!-- Lower Medallion Diamond Crest Accent -->
    <polygon points="250,380 258,390 250,400 242,390" fill="url(#goldGrad)" stroke="#0E294B" stroke-width="1.2" />
  </g>
</svg>
